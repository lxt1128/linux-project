#!/bin/bash
# 全场景错题管理系统 全局配置文件

# 支持的科目列表
SUBJECTS=("数学" "英语" "物理" "化学" "生物" "语文" "历史" "地理" "政治")

# 检索结果每页显示数量
PAGE_SIZE=10

# 日志级别
LOG_LEVEL="INFO"

# 复习相关默认配置
DEFAULT_REVIEW_TIMES=3

# 复习提醒频率（分钟）
REVIEW_NOTIFY_INTERVAL=60

# 复习间隔天数，遵循艾宾浩斯曲线
REVIEW_INTERVALS="1 2 4 7 15 30"

# 是否启用日志记录
ENABLE_LOGGING=true

# 数据目录路径
DATA_DIR="./data"
SUBJECTS_DIR="$DATA_DIR/subjects"

# 系统通知命令
NOTIFY_CMD="xmessage"
NOTIFY_TITLE="复习提醒"
